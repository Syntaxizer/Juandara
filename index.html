*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(255,145,189,.55),transparent 30%),radial-gradient(circle at 88% 12%,rgba(130,191,255,.55),transparent 31%),radial-gradient(circle at 50% 100%,rgba(255,210,229,.65),transparent 35%),linear-gradient(135deg,#f8eef7,#edf5ff 55%,#fff1f6);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 42%,rgba(255,255,255,.2));mix-blend-mode:screen}.top{min-height:52vh;display:grid;place-items:center;padding:70px 22px 55px;text-align:center}.hero{width:min(720px,94vw);padding:clamp(42px,7vw,72px) 25px;border:1px solid rgba(255,255,255,.68);border-radius:38px;background:rgba(255,255,255,.46);box-shadow:0 30px 90px rgba(79,91,145,.16),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.28);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(20px);opacity:.32}.hero:before{background:var(--pink);left:-90px;top:-95px}.hero:after{background:var(--blue);right:-90px;bottom:-95px}.eyebrow{position:relative;z-index:1;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:17px}h1{position:relative;z-index:1;margin:0;font-family:"Playfair Display",serif;font-size:clamp(52px,11vw,112px);font-weight:500;letter-spacing:-.055em;line-height:.95;background:linear-gradient(105deg,#f26fa7,#9c8ce9 52%,#65a9ee);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{position:relative;z-index:1;max-width:410px;margin:24px auto 0;font-size:14px;line-height:1.75;color:var(--muted)}.pill{display:inline-flex;position:relative;z-index:1;margin-top:25px;padding:9px 15px;b </style></head><body><header class="top"><div class="hero"><div class="eyebrow">a little world made of</div><h1>Juan &amp; Dara</h1><p class="subtitle">Two people, a bunch of moments, and the little things worth keeping.</p><div class="pill">♡ our memories</div></div></header><main><section class="gallery" id="gallery"></section><div class="hint">tap a memory to open</div></main><footer>JUAN &amp; DARA · MADE OF LITTLE MOMENTS</footer><div class="lightbox" id="lightbox"><button class="close" id="close">×</button><button class="nav prev" id="prev">‹</button><div class="viewer"><img id="viewerImg"></div><button class="nav next" id="next">›</button><div class="counter" id="counter"></div></div><script>const photos=["IMG_20260902_003058_760.jpg", "IMG_20260903_222053_298.jpg", "IMG_20260905_220913_262.jpg", "IMG_20260905_221910_411.jpg", "IMG_20260905_224547.jpg", "IMG_20260905_233139_591.jpg", "IMG_20260905_233317_888~2.jpg", "IMG_20260905_235056_873.jpg", "IMG_20260906_021011_730.jpg", "IMG_20260906_130503_657.jpg", "IMG_20260907_003210_756~2.jpg", "IMG_20260907_012216_679.jpg", "IMG_20260911_230112_132.jpg", "IMG_20260913_180726.png", "Screenshot_2026-09-06-01-51-37-798_com.google.android.apps.photos~2.jpg"];const g=document.getElementById("gallery"),l=document.getElementById("lightbox"),v=document.getElementById("viewerImg"),c=document.getElementById("counter");let cur=0;photos.forEach((f,i)=>{let a=document.createElement("article");a.className="card";a.innerHTML=`<img src="photos/${encodeURIComponent(f)}" alt="Juan & Dara memory ${i+1}" loading="${i<4?"eager":"lazy"}>`;a.onclick=()=>openV(i);g.appendChild(a)});function openV(i){cur=i;v.src="photos/"+encodeURIComponent(photos[cur]);c.textContent=`${cur+1} / ${photos.length}`;l.classList.add("open");document.body.style.overflow="hidden"}function closeV(){l.classList.remove("open");document.body.style.overflow=""}function move(d){openV((cur+d+photos.length)%photos.length)}document.getElementById("close").onclick=closeV;document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);l.onclick=e=>{if(e.target===l)closeV()};document.onkeydown=e=>{if(!l.classList.contains("open"))return;if(e.key==="Escape")closeV();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)};</script></body></html>
